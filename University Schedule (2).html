<!DOCTYPE html>
<html lang="ka" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ჩემი უნივერსიტეტის განრიგი - Pro</title>
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#090d16">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="უნივერსიტეტის განრიგი">

    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #090d16;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar {
            height: 4px;
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #111827;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 2px;
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .glass-input {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white pb-24">

    <!-- Top App Bar -->
    <header class="sticky top-0 z-50 glass-card border-b border-slate-800/80 px-4 py-3">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-base font-bold tracking-tight text-white flex items-center gap-2">
                    <i class="fa-solid fa-graduation-cap text-indigo-400"></i> უნივერსიტეტის განრიგი
                </h1>
                <p id="current-date-str" class="text-xs text-slate-400">იტვირთება...</p>
            </div>
            <div class="flex items-center gap-2">
                <span id="live-clock" class="text-xs font-mono bg-slate-800/80 px-2.5 py-1 rounded-full border border-slate-700/60 text-indigo-300 shadow-inner">00:00:00</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md w-full mx-auto p-4 space-y-4 flex-grow">

        <!-- Search Bar -->
        <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                <i class="fa-solid fa-magnifying-glass text-xs"></i>
            </span>
            <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="მოძებნე საგანი, ლექტორი ან ოთახი..." class="glass-input w-full py-2.5 pl-10 pr-4 rounded-xl text-xs text-white placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition-all shadow-inner">
        </div>

        <!-- Next Lecture Dynamic Card / Widget -->
        <section id="next-lecture-section" class="glass-card rounded-2xl p-4 border border-indigo-500/30 shadow-xl shadow-indigo-500/5 relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl pointer-events-none"></div>
            <div class="flex justify-between items-center mb-2.5">
                <span id="nl-status-badge" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                    <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-pulse"></span>
                    უახლოესი ლექცია
                </span>
                <span id="countdown-timer" class="text-xs font-mono font-semibold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">--:--:--</span>
            </div>
            
            <div id="next-lecture-content">
                <h3 id="nl-title" class="text-sm font-bold text-white mb-1 leading-snug">იტვირთება...</h3>
                <p id="nl-details" class="text-xs text-slate-300 mb-2.5 flex items-center gap-2">
                    <span id="nl-type-badge" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 text-[10px]">--</span>
                    <span id="nl-time" class="text-slate-400">--:-- - --:--</span>
                </p>
                <div class="grid grid-cols-2 gap-2 text-[11px] text-slate-400 pt-2 border-t border-slate-800/80">
                    <div class="flex items-center gap-1.5 truncate">
                        <i class="fa-solid fa-user-tie text-indigo-400 shrink-0"></i>
                        <span id="nl-lecturer" class="truncate">--</span>
                    </div>
                    <div class="flex items-center gap-1.5 truncate">
                        <i class="fa-solid fa-location-dot text-rose-400 shrink-0"></i>
                        <span id="nl-location" class="truncate">--</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Day Selector Tabs -->
        <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar" id="day-tabs">
            <button onclick="switchTab('all')" class="day-tab px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-indigo-600 text-white shadow-md shadow-indigo-600/30" data-day="all">ყველა დღე</button>
            <button onclick="switchTab('სამშაბათი')" class="day-tab px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-slate-800/80 text-slate-300 border border-slate-700/60 hover:bg-slate-700" data-day="სამშაბათი">სამშაბათი</button>
            <button onclick="switchTab('ოთხშაბათი')" class="day-tab px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-slate-800/80 text-slate-300 border border-slate-700/60 hover:bg-slate-700" data-day="ოთხშაბათი">ოთხშაბათი</button>
            <button onclick="switchTab('ხუთშაბათი')" class="day-tab px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-slate-800/80 text-slate-300 border border-slate-700/60 hover:bg-slate-700" data-day="ხუთშაბათი">ხუთშაბათი</button>
            <button onclick="switchTab('პარასკევი')" class="day-tab px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-slate-800/80 text-slate-300 border border-slate-700/60 hover:bg-slate-700" data-day="პარასკევი">პარასკევი</button>
        </div>

        <!-- Schedule List Container -->
        <div id="schedule-container" class="space-y-4">
            <!-- Dynamically populated via JS -->
        </div>

    </main>

    <!-- Bottom Mobile Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 glass-card border-t border-slate-800/80 py-2.5 px-6 z-50">
        <div class="max-w-md mx-auto flex justify-around items-center text-slate-400">
            <button onclick="switchTab('all')" class="flex flex-col items-center gap-1 text-indigo-400 transition-colors">
                <i class="fa-solid fa-calendar-days text-base"></i>
                <span class="text-[10px] font-medium">განრიგი</span>
            </button>
            <button onclick="scrollToNextLecture()" class="flex flex-col items-center gap-1 hover:text-indigo-400 transition-colors">
                <i class="fa-solid fa-clock text-base"></i>
                <span class="text-[10px] font-medium">უახლოესი</span>
            </button>
            <button onclick="resetSearchAndFilter()" class="flex flex-col items-center gap-1 hover:text-indigo-400 transition-colors">
                <i class="fa-solid fa-rotate-right text-base"></i>
                <span class="text-[10px] font-medium">განახლება</span>
            </button>
        </div>
    </nav>

    <!-- Script Application Logic -->
    <script>
        // Register Service Worker for true offline PWA support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered successfully:', reg.scope))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }

        const rawScheduleData = [
            {
                day: "სამშაბათი",
                dayIndex: 2,
                items: [
                    { title: "მენეჯმენტის საფუძვლები", type: "სამუშაო ჯგუფი", start: "11:00", end: "11:50", lecturer: "ხარხელი მანანა", location: "X კორპუსი/12 სართული/1217" },
                    { title: "მენეჯმენტის საფუძვლები", type: "სამუშაო ჯგუფი", start: "12:00", end: "12:50", lecturer: "ხარხელი მანანა", location: "X კორპუსი/12 სართული/1217" },
                    { title: "ეკონომიკის ციფრული ტრანსფორმაცია და მდგრადი ეკონომიკა", type: "სამუშაო ჯგუფი", start: "13:00", end: "14:50", lecturer: "ლაშარაშვილი თეა", location: "X კორპუსი/10 სართული/1010" },
                    { title: "მარკეტინგი 2", type: "სამუშაო ჯგუფი", start: "15:00", end: "15:50", lecturer: "მიქატაძე ცირა", location: "X კორპუსი/11 სართული/1104" },
                    { title: "მარკეტინგი 2", type: "სამუშაო ჯგუფი", start: "16:00", end: "16:50", lecturer: "მიქატაძე ცირა", location: "X კორპუსი/11 სართული/1104" },
                    { title: "მიკროეკონომიკის პრინციპები", type: "სამუშაო ჯგუფი", start: "17:00", end: "18:50", lecturer: "ჭიკაიძე ნათია", location: "X კორპუსი/9 სართული/902" },
                    { title: "ბიზნესის ადმინისტრირების საფუძვლები 1 (ბიზნესის გარემო)", type: "სამუშაო ჯგუფი", start: "19:00", end: "20:50", lecturer: "შენგელია თეიმურაზ", location: "X კორპუსი/10 სართული/1006" }
                ]
            },
            {
                day: "ოთხშაბათი",
                dayIndex: 3,
                items: [
                    { title: "მენეჯმენტის საფუძვლები", type: "ლექცია", start: "11:00", end: "11:50", lecturer: "ქიშელაშვილი გიული", location: "X კორპუსი/2 სართული/201" },
                    { title: "მარკეტინგი 2", type: "ლექცია", start: "15:00", end: "15:50", lecturer: "სეთური მაია", location: "X კორპუსი/11 სართული/1110" },
                    { title: "ადამიანური რესურსების მართვა", type: "სამუშაო ჯგუფი", start: "17:00", end: "17:50", lecturer: "ტუღუში მირიან", location: "X კორპუსი/12 სართული/1212" },
                    { title: "ადამიანური რესურსების მართვა", type: "სამუშაო ჯგუფი", start: "18:00", end: "18:50", lecturer: "ტუღუში მირიან", location: "X კორპუსი/12 სართული/1212" },
                    { title: "ბიზნესის ადმინისტრირების საფუძვლები 1 (ბიზნესის გარემო)", type: "ლექცია", start: "19:00", end: "19:50", lecturer: "ბაბუნაშვილი თეიმურაზ", location: "X კორპუსი/2 სართული/208" },
                    { title: "მიკროეკონომიკის პრინციპები", type: "ლექცია", start: "20:00", end: "20:50", lecturer: "ავალიანი ეკა", location: "X კორპუსი/2 სართული/205" }
                ]
            },
            {
                day: "ხუთშაბათი",
                dayIndex: 4,
                items: [
                    { title: "ეკონომიკის ციფრული ტრანსფორმაცია და მდგრადი ეკონომიკა", type: "ლექცია", start: "17:00", end: "17:50", lecturer: "კაკულია ნაზირა", location: "X კორპუსი/2 სართული/201" },
                    { title: "ფინანსური ინსტიტუტები და ბაზრები", type: "ლექცია", start: "19:00", end: "19:50", lecturer: "ჩუთლაშვილი ავთანდილი", location: "X კორპუსი/2 სართული/202" }
                ]
            },
            {
                day: "პარასკევი",
                dayIndex: 5,
                items: [
                    { title: "ადამიანური რესურსების მართვა", type: "ლექცია", start: "18:00", end: "18:50", lecturer: "კურტანიძე ანა", location: "X კორპუსი/2 სართული/201" },
                    { title: "ფინანსური ინსტიტუტები და ბაზრები", type: "სამუშაო ჯგუფი", start: "19:00", end: "19:50", lecturer: "დუდუჩავა ლილია", location: "X კორპუსი/4 სართული/404 (სასწავლო)" },
                    { title: "ფინანსური ინსტიტუტები და ბაზრები", type: "სამუშაო ჯგუფი", start: "20:00", end: "20:50", lecturer: "დუდუჩავა ლილია", location: "X კორპუსი/4 სართული/404 (სასწავლო)" }
                ]
            }
        ];

        // Helper function to convert "HH:MM" to minutes from midnight
        function timeToMins(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        }

        // Helper function to format duration in minutes to readable Georgian string
        function formatDuration(mins) {
            if (mins < 60) {
                return `${mins} წთ`;
            }
            const hrs = Math.floor(mins / 60);
            const remMins = mins % 60;
            if (remMins === 0) {
                return `${hrs} სთ`;
            }
            return `${hrs} სთ ${remMins} წთ`;
        }

        // Merge consecutive items with 10-min informal breaks and compute durations & breaks
        const scheduleData = rawScheduleData.map(dayGroup => {
            const mergedItems = [];
            let items = dayGroup.items;

            for (let i = 0; i < items.length; i++) {
                let current = { ...items[i] };
                
                while (i + 1 < items.length) {
                    let next = items[i + 1];
                    if (
                        next.title === current.title &&
                        next.type === current.type &&
                        next.lecturer === current.lecturer &&
                        next.location === current.location
                    ) {
                        let currEndMins = timeToMins(current.end);
                        let nextStartMins = timeToMins(next.start);
                        if (nextStartMins - currEndMins <= 15) {
                            current.end = next.end;
                            i++;
                        } else {
                            break;
                        }
                    } else {
                        break;
                    }
                }

                const startMins = timeToMins(current.start);
                const endMins = timeToMins(current.end);
                current.durationMins = endMins - startMins;

                mergedItems.push(current);
            }

            for (let j = 0; j < mergedItems.length; j++) {
                if (j + 1 < mergedItems.length) {
                    let currEnd = timeToMins(mergedItems[j].end);
                    let nextStart = timeToMins(mergedItems[j+1].start);
                    let gap = nextStart - currEnd;
                    mergedItems[j].breakToNext = gap > 0 ? gap : 0;
                } else {
                    mergedItems[j].breakToNext = 0;
                }
            }

            return {
                ...dayGroup,
                items: mergedItems
            };
        });

        let activeFilter = 'all';
        let searchQuery = '';

        function renderSchedule() {
            const container = document.getElementById('schedule-container');
            container.innerHTML = '';

            let dataToRender = scheduleData;
            if (activeFilter !== 'all') {
                dataToRender = scheduleData.filter(d => d.day === activeFilter);
            }

            let filteredData = dataToRender.map(dayGroup => {
                let items = dayGroup.items.filter(item => 
                    item.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    item.lecturer.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    item.location.toLowerCase().includes(searchQuery.toLowerCase())
                );
                return { ...dayGroup, items };
            }).filter(dayGroup => dayGroup.items.length > 0);

            if (filteredData.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500 text-xs">მონაცემები ვერ მოიძებნა</div>`;
                return;
            }

            const now = new Date();
            const currentDayIndex = now.getDay();
            const currentMins = now.getHours() * 60 + now.getMinutes();
            const dayMappingReverse = { 2: "სამშაბათი", 3: "ოთხშაბათი", 4: "ხუთშაბათი", 5: "პარასკევი" };
            const todayName = dayMappingReverse[currentDayIndex];

            filteredData.forEach(dayGroup => {
                const dayWrapper = document.createElement('div');
                dayWrapper.className = 'space-y-3';
                
                let html = `
                    <div class="flex items-center gap-2 pt-2">
                        <h2 class="text-xs font-bold uppercase tracking-wider text-indigo-400 bg-indigo-500/10 px-3 py-1 rounded-lg border border-indigo-500/20 inline-block">${dayGroup.day}</h2>
                        <div class="h-[1px] bg-slate-800 flex-grow"></div>
                        <span class="text-[10px] text-slate-500 font-mono">${dayGroup.items.length} სესია</span>
                    </div>
                    <div class="space-y-3">
                `;

                dayGroup.items.forEach(item => {
                    const isLecture = item.type === 'ლექცია';
                    const badgeColor = isLecture ? 'bg-amber-500/10 text-amber-300 border-amber-500/20' : 'bg-blue-500/10 text-blue-300 border-blue-500/20';
                    
                    const startMins = timeToMins(item.start);
                    const endMins = timeToMins(item.end);
                    
                    let itemStatusHtml = '';
                    if (dayGroup.day === todayName) {
                        if (currentMins < startMins) {
                            itemStatusHtml = `<span class="px-2 py-0.5 rounded text-[10px] font-medium bg-slate-800 text-slate-300 border border-slate-700">ჯერ არ დაწყებულა</span>`;
                        } else if (currentMins >= startMins && currentMins <= endMins) {
                            itemStatusHtml = `<span class="px-2 py-0.5 rounded text-[10px] font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 animate-pulse">მიმდინარეობს ახლა</span>`;
                        } else {
                            itemStatusHtml = `<span class="px-2 py-0.5 rounded text-[10px] font-medium bg-slate-900 text-slate-500 border border-slate-800">დასრულებულია</span>`;
                        }
                    }

                    html += `
                        <div class="glass-card rounded-xl p-3.5 border border-slate-800/80 hover:border-slate-700 transition-all shadow-sm space-y-2.5">
                            <div class="flex justify-between items-start gap-2">
                                <div class="space-y-1">
                                    <h3 class="text-xs font-bold text-slate-100 leading-snug">${item.title}</h3>
                                    <div class="flex items-center gap-1.5 flex-wrap">
                                        <span class="px-2 py-0.5 rounded text-[10px] font-medium border ${badgeColor}">${item.type}</span>
                                        ${itemStatusHtml}
                                        <span class="text-[10px] text-indigo-400 font-mono bg-indigo-500/10 px-1.5 py-0.5 rounded">ხანგრძლივობა: ${formatDuration(item.durationMins)}</span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="flex flex-wrap items-center gap-y-1 gap-x-3 text-xs text-slate-300 pt-1 border-t border-slate-800/60">
                                <span class="flex items-center gap-1 font-mono text-indigo-300 bg-indigo-500/10 px-2 py-0.5 rounded">
                                    <i class="fa-regular fa-clock"></i> ${item.start} - ${item.end}
                                </span>
                                <span class="flex items-center gap-1 truncate">
                                    <i class="fa-solid fa-user-tie text-slate-400"></i> ${item.lecturer}
                                </span>
                            </div>

                            <div class="flex items-center gap-1.5 text-[11px] text-slate-300 bg-slate-950/50 px-2.5 py-1.5 rounded-lg border border-slate-800/60">
                                <i class="fa-solid fa-location-dot text-rose-400 shrink-0"></i>
                                <span class="font-medium text-white truncate">${item.location}</span>
                            </div>
                        </div>
                    `;

                    if (item.breakToNext > 0) {
                        html += `
                            <div class="flex items-center justify-center gap-2 py-1.5 text-[11px] text-emerald-400/90 font-medium bg-emerald-500/5 rounded-lg border border-emerald-500/10">
                                <i class="fa-solid fa-mug-hot text-xs"></i>
                                <span>შესვენება / თავისუფალი დრო: ${formatDuration(item.breakToNext)}</span>
                            </div>
                        `;
                    }
                });

                html += `</div>`;
                dayWrapper.innerHTML = html;
                container.appendChild(dayWrapper);
            });
        }

        function switchTab(day) {
            activeFilter = day;
            document.querySelectorAll('.day-tab').forEach(btn => {
                if (btn.getAttribute('data-day') === day) {
                    btn.className = "day-tab px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-indigo-600 text-white shadow-md shadow-indigo-600/30";
                } else {
                    btn.className = "day-tab px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-slate-800/80 text-slate-300 border border-slate-700/60 hover:bg-slate-700";
                }
            });
            renderSchedule();
        }

        function handleSearch(query) {
            searchQuery = query.trim();
            renderSchedule();
        }

        function resetSearchAndFilter() {
            document.getElementById('search-input').value = '';
            searchQuery = '';
            const currentDayIndex = new Date().getDay();
            const dayMappingReverse = { 2: "სამშაბათი", 3: "ოთხშაბათი", 4: "ხუთშაბათი", 5: "პარასკევი" };
            if (dayMappingReverse[currentDayIndex]) {
                switchTab(dayMappingReverse[currentDayIndex]);
            } else {
                switchTab('all');
            }
        }

        function updateDateTimeAndNextLecture() {
            const now = new Date();
            
            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            document.getElementById('current-date-str').textContent = now.toLocaleDateString('ka-GE', options);
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('live-clock').textContent = `${hours}:${minutes}:${seconds}`;

            const dayMapping = { 2: "სამშაბათი", 3: "ოთხშაბათი", 4: "ხუთშაბათი", 5: "პარასკევი" };
            const currentDayIndex = now.getDay();
            const currentTimeMinutes = now.getHours() * 60 + now.getMinutes();

            let upcoming = null;

            for (let i = 0; i < 7; i++) {
                let checkIndex = (currentDayIndex + i) % 7;
                let dayName = dayMapping[checkIndex];
                if (!dayName) continue;

                let dayObj = scheduleData.find(d => d.day === dayName);
                if (!dayObj) continue;

                for (let item of dayObj.items) {
                    let sMins = timeToMins(item.start);
                    let eMins = timeToMins(item.end);

                    if (i === 0) {
                        if (currentTimeMinutes >= sMins && currentTimeMinutes <= eMins) {
                            upcoming = { ...item, dayName, dayOffset: 0, statusText: "მიმდინარეობს ახლა", statusType: "ongoing" };
                            break;
                        }
                        if (sMins > currentTimeMinutes) {
                            upcoming = { ...item, dayName, dayOffset: 0, statusText: "ჯერ არ დაწყებულა", statusType: "upcoming" };
                            break;
                        }
                    } else {
                        upcoming = { ...item, dayName, dayOffset: i, statusText: "მომავალი ლექცია", statusType: "upcoming" };
                        break;
                    }
                }
                if (upcoming) break;
            }

            if (!upcoming && scheduleData.length > 0) {
                let firstDay = scheduleData[0];
                let item = firstDay.items[0];
                upcoming = { ...item, dayName: firstDay.day, dayOffset: 7, statusText: "მომავალი კვირა", statusType: "upcoming" };
            }

            if (upcoming) {
                document.getElementById('nl-title').textContent = upcoming.title;
                document.getElementById('nl-type-badge').textContent = upcoming.type;
                document.getElementById('nl-time').textContent = `${upcoming.dayName} (${upcoming.start} - ${upcoming.end}) • ${formatDuration(upcoming.durationMins)}`;
                document.getElementById('nl-lecturer').textContent = upcoming.lecturer;
                document.getElementById('nl-location').textContent = upcoming.location;

                const statusBadge = document.getElementById('nl-status-badge');
                if (upcoming.statusType === "ongoing") {
                    statusBadge.className = "inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
                    statusBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> მიმდინარეობს ახლა`;
                    document.getElementById('countdown-timer').textContent = "აქტიურია";
                } else {
                    statusBadge.className = "inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-indigo-500/20 text-indigo-300 border border-indigo-500/30";
                    statusBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-pulse"></span> ${upcoming.statusText}`;

                    let targetDate = new Date(now);
                    if (upcoming.dayOffset > 0) {
                        targetDate.setDate(now.getDate() + upcoming.dayOffset);
                    }
                    let [sHour, sMin] = upcoming.start.split(':').map(Number);
                    targetDate.setHours(sHour, sMin, 0, 0);

                    let diffMs = targetDate - now;
                    if (diffMs > 0) {
                        let diffHrs = Math.floor(diffMs / (1000 * 60 * 60));
                        let diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
                        let diffSecs = Math.floor((diffMs % (1000 * 60)) / 1000);
                        
                        let countdownStr = "";
                        if (diffHrs > 0) countdownStr += `${diffHrs}სთ `;
                        countdownStr += `${diffMins}წთ ${diffSecs}წმ`;
                        document.getElementById('countdown-timer').textContent = countdownStr;
                    }
                }
            }
        }

        function scrollToNextLecture() {
            document.getElementById('next-lecture-section').scrollIntoView({ behavior: 'smooth' });
        }

        const currentDayIndex = new Date().getDay();
        const dayMappingReverse = { 2: "სამშაბათი", 3: "ოთხშაბათი", 4: "ხუთშაბათი", 5: "პარასკევი" };
        if (dayMappingReverse[currentDayIndex]) {
            switchTab(dayMappingReverse[currentDayIndex]);
        } else {
            renderSchedule();
        }

        updateDateTimeAndNextLecture();
        setInterval(updateDateTimeAndNextLecture, 1000);
    </script>
</body>
</html>
