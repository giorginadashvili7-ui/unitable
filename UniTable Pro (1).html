<!DOCTYPE html>
<html lang="ka" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- DYNAMIC APP TITLE -->
    <title id="meta-app-title">UniTable Pro</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#040712',
                        cardBg: '#0c1425',
                        accent: '#3b82f6',
                        accentHover: '#2563eb',
                        dayRed: '#f87171'
                    }
                }
            }
        }
    </script>
    <!-- Inter Font & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- PWA Dynamic Manifest & Icon Setup -->
    <link id="pwa-manifest" rel="manifest" href="">
    <link id="favicon-link" rel="icon" type="image/svg+xml" href="">
    <meta name="theme-color" content="#040712">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" id="apple-app-title" content="UniTable Pro">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #040712;
            color: #f1f5f9;
        }
        .glass-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.85) 0%, rgba(11, 18, 32, 0.95) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .glass-card-hover:hover {
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 12px 35px rgba(59, 130, 246, 0.15);
        }
        .pulse-glow {
            box-shadow: 0 0 35px rgba(59, 130, 246, 0.2);
        }
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade {
            animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-accent selection:text-white pb-6">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 glass-card border-b border-slate-800/80 px-3.5 py-3 shadow-2xl">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div id="header-logo-container" class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-blue-500/40 text-white text-xs">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div>
                    <h1 id="header-app-name" class="font-extrabold text-sm leading-none tracking-tight bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent">UniTable Pro</h1>
                    <p class="text-[10px] text-slate-400 mt-1 font-medium" id="current-date-str">იტვირთება...</p>
                </div>
            </div>

            <!-- Center: Today's active study hours range -->
            <div class="text-center px-3 py-1.5 bg-slate-900/90 rounded-2xl border border-slate-800 shadow-inner">
                <div class="text-[9px] uppercase tracking-wider text-slate-400 font-bold mb-0.5">დღის დიაპაზონი</div>
                <div id="today-active-range" class="text-[11px] font-mono font-extrabold text-accent tracking-tight">--:-- - --:--</div>
            </div>

            <div class="text-right flex items-center gap-2">
                <div>
                    <div id="live-clock" class="text-xs font-mono font-extrabold text-slate-100 tracking-wider leading-none">00:00:00</div>
                    <div class="text-[9px] text-emerald-400 font-semibold mt-1 flex items-center justify-end gap-1">
                        <span id="online-status-dot" class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> <span id="online-status-text">ონლაინ</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-md w-full mx-auto p-3.5 flex-1 space-y-3.5">
        
        <!-- Tab Navigation -->
        <div class="grid grid-cols-3 gap-1.5 p-1 glass-card rounded-2xl border border-slate-800/80">
            <button onclick="switchTab('schedule')" id="tab-btn-schedule" class="py-2.5 px-2 rounded-xl text-[11px] font-bold transition-all bg-accent text-white shadow-lg shadow-accent/30 flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-calendar-days text-xs"></i> განრიგი
            </button>
            <button onclick="switchTab('calendar')" id="tab-btn-calendar" class="py-2.5 px-2 rounded-xl text-[11px] font-bold transition-all text-slate-400 hover:text-white flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-calendar text-xs"></i> კალენდარი
            </button>
            <button onclick="switchTab('notes')" id="tab-btn-notes" class="py-2.5 px-2 rounded-xl text-[11px] font-bold transition-all text-slate-400 hover:text-white flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-note-sticky text-xs"></i> შენიშვნები
            </button>
        </div>

        <!-- TAB 1: SCHEDULE VIEW -->
        <div id="tab-content-schedule" class="space-y-3.5 animate-fade">
            <!-- Upcoming Lecture Card -->
            <div id="next-lecture-card" class="glass-card rounded-2xl p-4 border border-blue-500/30 pulse-glow relative overflow-hidden hidden">
                <div class="absolute -right-8 -bottom-8 w-24 h-24 bg-blue-500/15 rounded-full blur-2xl pointer-events-none"></div>
                <div class="flex items-center justify-between mb-2.5">
                    <div id="nl-status-container" class="flex items-center gap-1.5 flex-wrap"></div>
                    <span id="countdown-timer" class="text-[11px] font-mono font-bold text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-xl border border-amber-500/25 shadow-sm">--:--</span>
                </div>
                <h2 id="nl-title" class="font-bold text-xs text-white mb-1 leading-snug">სათაური</h2>
                <div class="text-[11px] text-slate-300 mb-3 font-medium flex items-center gap-1.5">
                    <i class="fa-solid fa-chalkboard-user text-accent text-xs"></i> <span id="nl-lecturer">ლექტორი</span>
                </div>
                <div class="flex items-center justify-between text-[11px] text-slate-300 pt-2.5 border-t border-slate-800/60">
                    <div id="nl-room" class="truncate flex items-center gap-1.5 flex-wrap"></div>
                    <span id="nl-time" class="font-mono font-bold text-slate-200">დრო</span>
                </div>
            </div>

            <!-- Day Filters -->
            <div class="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none" id="day-filters">
                <button onclick="filterDay('all')" class="day-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-accent text-white shadow-md shadow-accent/20" data-day="all">
                    <i class="fa-solid fa-layer-group mr-1"></i> ყველა
                </button>
                <button onclick="filterDay('სამშაბათი')" class="day-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-slate-900/90 text-blue-400 hover:text-white border border-slate-800" data-day="სამშაბათი">სამშაბათი</button>
                <button onclick="filterDay('ოთხშაბათი')" class="day-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-slate-900/90 text-blue-400 hover:text-white border border-slate-800" data-day="ოთხშაბათი">ოთხშაბათი</button>
                <button onclick="filterDay('ხუთშაბათი')" class="day-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-slate-900/90 text-blue-400 hover:text-white border border-slate-800" data-day="ხუთშაბათი">ხუთშაბათი</button>
                <button onclick="filterDay('პარასკევი')" class="day-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-slate-900/90 text-blue-400 hover:text-white border border-slate-800" data-day="პარასკევი">პარასკევი</button>
            </div>

            <!-- Schedule Container -->
            <div class="space-y-3" id="schedule-container"></div>
        </div>

        <!-- TAB 2: CALENDAR VIEW -->
        <div id="tab-content-calendar" class="space-y-4 hidden animate-fade">
            <div class="glass-card rounded-2xl p-4 space-y-4 border border-slate-800 shadow-xl relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-28 h-28 bg-accent/10 rounded-full blur-3xl pointer-events-none"></div>
                
                <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                    <button onclick="changeMonth(-1)" class="w-8 h-8 rounded-xl bg-slate-900/90 hover:bg-slate-800 text-slate-300 flex items-center justify-center border border-slate-800 transition-all">
                        <i class="fa-solid fa-chevron-left text-xs"></i>
                    </button>
                    <h3 id="cal-month-year-title" class="font-extrabold text-sm text-white tracking-wide">სექტემბერი 2026</h3>
                    <button onclick="changeMonth(1)" class="w-8 h-8 rounded-xl bg-slate-900/90 hover:bg-slate-800 text-slate-300 flex items-center justify-center border border-slate-800 transition-all">
                        <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                </div>

                <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-blue-400 uppercase tracking-wider">
                    <div>ორშ</div><div>სამ</div><div>ოთხ</div><div>ხუთ</div><div>პარ</div><div>შაბ</div><div>კვ</div>
                </div>

                <div id="cal-days-grid" class="grid grid-cols-7 gap-1.5 pt-1"></div>
            </div>

            <div id="cal-selected-details" class="glass-card rounded-2xl p-4 space-y-3 border border-slate-800 shadow-xl"></div>
        </div>

        <!-- TAB 3: NOTES VIEW -->
        <div id="tab-content-notes" class="space-y-4 hidden animate-fade">
            <div class="glass-card rounded-2xl p-5 space-y-3.5 border border-slate-800 shadow-xl relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-28 h-28 bg-accent/10 rounded-full blur-3xl pointer-events-none"></div>
                <div class="flex items-center justify-between pb-2.5 border-b border-slate-800">
                    <div class="flex items-center gap-2">
                        <div class="w-7 h-7 rounded-xl bg-accent/20 text-accent flex items-center justify-center text-xs shadow-sm">
                            <i class="fa-solid fa-pen-nib"></i>
                        </div>
                        <h3 class="font-extrabold text-xs text-white uppercase tracking-wider">სწრაფი შენიშვნა</h3>
                    </div>
                    <span class="text-[10px] text-slate-400 font-medium">ჩანაწერები</span>
                </div>
                
                <div class="space-y-3">
                    <div>
                        <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">სათაური / საგანი</label>
                        <input type="text" id="note-title-input" placeholder="მაგ: მენეჯმენტის პროექტი..." class="w-full bg-slate-900/90 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-accent transition-all shadow-inner">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">ტექსტი</label>
                        <textarea id="note-text-input" rows="3.5" placeholder="ჩაწერეთ მნიშვნელოვანი დეტალები..." class="w-full bg-slate-900/90 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-accent transition-all resize-none shadow-inner"></textarea>
                    </div>
                </div>

                <button onclick="saveNote()" class="w-full py-2.5 bg-accent hover:bg-accentHover text-white rounded-xl text-xs font-bold transition-all shadow-lg shadow-accent/25 flex items-center justify-center gap-2 active:scale-[0.98]">
                    <i class="fa-solid fa-plus text-xs"></i> შენახვა
                </button>
            </div>

            <div class="flex items-center justify-between px-1">
                <h4 class="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-1.5">
                    <i class="fa-solid fa-box-archive text-accent"></i> შენახული შენიშვნები
                </h4>
                <span id="notes-counter" class="text-[10px] font-mono text-accent bg-accent/10 px-2.5 py-1 rounded-lg border border-accent/25 font-bold">0</span>
            </div>

            <div class="space-y-2.5" id="notes-container"></div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="glass-card border-t border-slate-800/80 py-3 px-4 text-center mt-4">
        <div class="max-w-md mx-auto flex items-center justify-between text-[10px] text-slate-400">
            <span class="font-medium" id="footer-version-str">UniTable Pro v3.3 Offline</span>
            <button id="install-btn" onclick="installPWA()" class="hidden bg-accent hover:bg-accentHover text-white px-3.5 py-1.5 rounded-lg font-semibold shadow-md shadow-accent/20 transition-all flex items-center gap-1.5">
                <i class="fa-solid fa-download"></i> დაყენება
            </button>
            <span class="flex items-center gap-1.5 text-emerald-400 font-semibold"><i class="fa-solid fa-shield-check"></i> ოფლაინ მზა</span>
        </div>
    </footer>

    <script>
        const APP_CONFIG = {
            appName: "UniTable Pro",
            logoIconClass: "fa-solid fa-bolt",
        };

        document.getElementById('meta-app-title').innerText = APP_CONFIG.appName;
        document.getElementById('apple-app-title').content = APP_CONFIG.appName;
        document.getElementById('header-app-name').innerText = APP_CONFIG.appName;
        document.getElementById('header-logo-container').innerHTML = `<i class="${APP_CONFIG.logoIconClass}"></i>`;

        const svgFavicon = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%233b82f6'/><path d='M256 128L112 256h96v128h96V256h96z' fill='%23fff'/></svg>`;
        document.getElementById('favicon-link').href = `data:image/svg+xml,${encodeURIComponent(svgFavicon)}`;

        // Register robust Offline Service Worker using blob URL for standalone hosting support
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'unitable-pro-v3.3';
                const urlsToCache = ['./', './index.html'];
                self.addEventListener('install', event => {
                    event.waitUntil(
                        caches.open(CACHE_NAME).then(cache => cache.addAll(urlsToCache))
                    );
                    self.skipWaiting();
                });
                self.addEventListener('activate', event => {
                    event.waitUntil(
                        caches.keys().then(keys => Promise.all(
                            keys.map(key => { if(key !== CACHE_NAME) return caches.delete(key); })
                        ))
                    );
                    self.clients.claim();
                });
                self.addEventListener('fetch', event => {
                    event.respondWith(
                        caches.match(event.request).then(response => {
                            return response || fetch(event.request).catch(() => caches.match('./index.html'));
                        })
                    );
                });
            `;
            const swBlob = new Blob([swCode], { type: 'text/javascript' });
            const swUrl = URL.createObjectURL(swBlob);
            navigator.serviceWorker.register(swUrl).catch(err => console.log('SW error:', err));
        }

            name: APP_CONFIG.appName,
            short_name: APP_CONFIG.appName,
            start_url: "./index.html",
            display: "standalone",
            background_color: "#040712",
            theme_color: "#040712",
            icons: [{
                src: `data:image/svg+xml,${encodeURIComponent(svgFavicon)}`,
                sizes: "512x512",
                type: "image/svg+xml"
            }]
        };
        document.getElementById('pwa-manifest').href = `data:application/manifest+json;base64,${btoa(JSON.stringify(pwaManifestObj))}`;

        const rawScheduleData = [

            { id: 2, course: "მენეჯმენტის საფუძვლები", type: "სამუშაო ჯგუფი", lecturer: "ხარხელი მანანა", location: "X კორპუსი / 12 სართული / 1217", day: "სამშაბათი", startTime: "12:00", endTime: "12:50" },
            { id: 3, course: "ეკონომიკის ციფრული ტრანსფორმაცია და მდგრადი ეკონომიკა", type: "სამუშაო ჯგუფი", lecturer: "ლაშარაშვილი თეა", location: "X კორპუსი / 10 სართული / 1010", day: "სამშაბათი", startTime: "13:00", endTime: "14:50" },

            { id: 14, course: "ეკონომიკის ციფრული ტრანსფორმაცია და მდგრადი ეკონომიკა", type: "ლექცია", lecturer: "კაკულია ნაზირა", location: "X კორპუსი / 2 სართული / 201", day: "ხუთშაბათი", startTime: "17:00", endTime: "17:50" },
            { id: 15, course: "ფინანსური ინსტიტუტები და ბაზრები", type: "ლექცია", lecturer: "ჩუთლაშვილი ავთანდილი", location: "X კორპუსი / 2 სართული / 202", day: "ხუთშაბათი", startTime: "19:00", endTime: "19:50" },
            { id: 16, course: "ადამიანური რესურსების მართვა", type: "ლექცია", lecturer: "კურტანიძე ანა", location: "X კორპუსი / 2 სართული / 201", day: "პარასკევი", startTime: "18:00", endTime: "18:50" },
            { id: 17, course: "ფინანსური ინსტიტუტები და ბაზრები", type: "სამუშაო ჯგუფი", lecturer: "დუდუჩავა ლილია", location: "X კორპუსი / 4 სართული / 404 (სასწავლო)", day: "პარასკევი", startTime: "19:00", endTime: "19:50" },
            { id: 18, course: "ფინანსური ინსტიტუტები და ბაზრები", type: "სამუშაო ჯგუფი", lecturer: "დუდუჩავა ლილია", location: "X კორპუსი / 4 სართული / 404 (სასწავლო)", day: "პარასკევი", startTime: "20:00", endTime: "20:50" }
        ];

        let currentFilter = 'all';
        let currentActiveTab = 'schedule';

        const dayNamesGeo = { 0: 'კვირა', 1: 'ორშაბათი', 2: 'სამშაბათი', 3: 'ოთხშაბათი', 4: 'ხუთშაბათი', 5: 'პარასკევი', 6: 'შაბათი' };
        const daysMapReverse = { 'სამშაბათი': 2, 'ოთხშაბათი': 3, 'ხუთშაბათი': 4, 'პარასკევი': 5 };
        const monthsGeo = ['იანვარი', 'თებერვალი', 'მარტი', 'აპრილი', 'მაისი', 'ივნისი', 'ივლისი', 'აგვისტო', 'სექტემბერი', 'ოქტომბერი', 'ნოემბერი', 'დეკემბერი'];

        let selectedDateObj = new Date();
        let calYear = selectedDateObj.getFullYear();
        let calMonth = selectedDateObj.getMonth();

        function timeToMinutes(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        }

        function parseLocation(locStr) {
            const parts = locStr.split('/').map(s => s.trim());
            if (parts.length >= 3) return { building: parts[0], floor: parts[1], room: parts[2] };
            return { building: 'X კორპუსი', floor: '', room: locStr };
        }

        function getProcessedSchedule() {
            const days = ['სამშაბათი', 'ოთხშაბათი', 'ხუთშაბათი', 'პარასკევი'];
            let result = [];
            days.forEach(day => {
                let dayItems = rawScheduleData.filter(i => i.day === day).sort((a, b) => timeToMinutes(a.startTime) - timeToMinutes(b.startTime));
                let merged = [];
                for (let i = 0; i < dayItems.length; i++) {
                    let curr = { ...dayItems[i] };
                    while (i + 1 < dayItems.length) {
                        let next = dayItems[i + 1];
                        if (next.course === curr.course && next.type === curr.type && next.lecturer === curr.lecturer && next.location === curr.location && (timeToMinutes(next.startTime) - timeToMinutes(curr.endTime)) <= 15) {
                            curr.endTime = next.endTime;
                            i++;
                        } else { break; }
                    }
                    merged.push(curr);
                }
                result = result.concat(merged);
            });
            return result;
        }

        const scheduleData = getProcessedSchedule();

        function switchTab(tab) {
            currentActiveTab = tab;
            const schedBtn = document.getElementById('tab-btn-schedule');
            const calBtn = document.getElementById('tab-btn-calendar');
            const notesBtn = document.getElementById('tab-btn-notes');
            const schedContent = document.getElementById('tab-content-schedule');
            const calContent = document.getElementById('tab-content-calendar');
            const notesContent = document.getElementById('tab-content-notes');

            schedBtn.className = 'py-2.5 px-2 rounded-xl text-[11px] font-bold transition-all text-slate-400 hover:text-white flex items-center justify-center gap-1.5';
            calBtn.className = 'py-2.5 px-2 rounded-xl text-[11px] font-bold transition-all text-slate-400 hover:text-white flex items-center justify-center gap-1.5';
            notesBtn.className = 'py-2.5 px-2 rounded-xl text-[11px] font-bold transition-all text-slate-400 hover:text-white flex items-center justify-center gap-1.5';

            schedContent.classList.add('hidden');
            calContent.classList.add('hidden');
            notesContent.classList.add('hidden');

            if (tab === 'schedule') {
                schedBtn.className = 'py-2.5 px-2 rounded-xl text-[11px] font-bold transition-all bg-accent text-white shadow-lg shadow-accent/30 flex items-center justify-center gap-1.5';
                schedContent.classList.remove('hidden');
            } else if (tab === 'calendar') {
                calBtn.className = 'py-2.5 px-2 rounded-xl text-[11px] font-bold transition-all bg-accent text-white shadow-lg shadow-accent/30 flex items-center justify-center gap-1.5';
                calContent.classList.remove('hidden');
                renderCalendar();
            } else {
                notesBtn.className = 'py-2.5 px-2 rounded-xl text-[11px] font-bold transition-all bg-accent text-white shadow-lg shadow-accent/30 flex items-center justify-center gap-1.5';
                notesContent.classList.remove('hidden');
                renderNotes();
            }
        }

        function updateClockAndDate() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('live-clock').innerText = `${hours}:${minutes}:${seconds}`;
            
            const dayNum = now.getDay();
            const dayName = dayNamesGeo[dayNum];
            document.getElementById('current-date-str').innerText = `${dayName}, ${now.getDate()} ${monthsGeo[now.getMonth()]}`;

            const todayItems = scheduleData.filter(i => i.day === dayName).sort((a, b) => timeToMinutes(a.startTime) - timeToMinutes(b.startTime));
            const rangeEl = document.getElementById('today-active-range');
            if (todayItems.length > 0) {
                rangeEl.innerText = `${todayItems[0].startTime} - ${todayItems[todayItems.length - 1].endTime}`;
            } else {
                rangeEl.innerText = `დასვენებაა`;
            }

            const dot = document.getElementById('online-status-dot');
            const txt = document.getElementById('online-status-text');
            if (navigator.onLine) {
                dot.className = "w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse";
                txt.innerText = "ონლაინ";
            } else {
                dot.className = "w-1.5 h-1.5 rounded-full bg-amber-500";
                txt.innerText = "ოფლაინ";
            }
        }

        setInterval(updateClockAndDate, 1000);
        updateClockAndDate();
        setInterval(() => {
            if (currentActiveTab === 'schedule') {
                renderSchedule();
                updateNextLectureCountdown();
            }
        }, 1000);

        function getItemStatus(item) {
            const now = new Date();
            const currentJsDay = now.getDay();
            const currentMin = now.getHours() * 60 + now.getMinutes();
            const itemDayIndex = daysMapReverse[item.day];
            if (itemDayIndex === undefined) return 'არ დაწყებულა';
            const startMin = timeToMinutes(item.startTime);
            const endMin = timeToMinutes(item.endTime);

            if (currentJsDay < itemDayIndex) return 'არ დაწყებულა';
            if (currentJsDay > itemDayIndex) return 'დასრულდა';
            if (currentMin < startMin) return 'არ დაწყებულა';
            if (currentMin >= startMin && currentMin <= endMin) return 'მიმდინარეობს';
            return 'დასრულდა';
        }

        function getStatusBadgeHtml(status) {
            if (status === 'მიმდინარეობს') {
                return `<span class="text-[9px] font-bold px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center gap-1 shadow-sm"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>მიმდინარეობს</span>`;
            } else if (status === 'დასრულდა') {
                return `<span class="text-[9px] font-semibold px-2 py-0.5 rounded-md bg-slate-800/80 text-slate-400 border border-slate-700/50">დასრულდა</span>`;
            } else {
                return `<span class="text-[9px] font-semibold px-2 py-0.5 rounded-md bg-blue-500/15 text-blue-400 border border-blue-500/30">არ დაწყებულა</span>`;
            }
        }

        function getTypeBadgeHtml(type) {
            if (type === 'ლექცია') {
                return `<span class="text-[9px] font-bold px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">${type}</span>`;
            } else {
                return `<span class="text-[9px] font-bold px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-400 border border-amber-500/30">${type}</span>`;
            }
        }

        function formatBreakTime(minutes) {
            if (minutes < 60) return `${minutes} წთ`;
            const hours = Math.floor(minutes / 60);
            const remMin = minutes % 60;
            return remMin === 0 ? `${hours} სთ` : `${hours} სთ ${remMin} წთ`;
        }

        function renderItemsWithBreaks(items, container) {
            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                const loc = parseLocation(item.location);
                const status = getItemStatus(item);
                
                const card = document.createElement('div');
                card.className = `glass-card glass-card-hover rounded-2xl p-4 space-y-3 relative transition-all duration-200 border ${status === 'მიმდინარეობს' ? 'border-emerald-500/50 shadow-xl shadow-emerald-500/10' : 'border-slate-800/80'}`;
                
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-mono font-extrabold text-white bg-slate-900/90 px-2.5 py-1 rounded-xl border border-slate-800 shadow-inner">${item.startTime} - ${item.endTime}</span>
                            ${getTypeBadgeHtml(item.type)}
                        </div>
                        <div>${getStatusBadgeHtml(status)}</div>
                    </div>
                    <div>
                        <h3 class="font-bold text-xs text-white leading-snug mb-1">${item.course}</h3>
                        <div class="text-[11px] text-slate-300 font-medium flex items-center gap-1.5">
                            <i class="fa-solid fa-chalkboard-user text-accent text-xs"></i> <span>${item.lecturer}</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between text-[11px] text-slate-300 pt-2.5 border-t border-slate-800/60">
                        <div class="flex items-center gap-1.5 truncate">
                            <i class="fa-solid fa-building text-accent text-xs"></i>
                            <span class="truncate">${loc.building} / აუდ: ${loc.room}</span>
                        </div>
                        <span class="text-[10px] text-slate-400 font-mono">${loc.floor}</span>
                    </div>
                `;
                container.appendChild(card);

                if (i + 1 < items.length) {
                    const nextItem = items[i + 1];
                    const breakMinutes = timeToMinutes(nextItem.startTime) - timeToMinutes(item.endTime);
                    if (breakMinutes > 0) {
                        const breakEl = document.createElement('div');
                        breakEl.className = 'flex items-center justify-center gap-2 py-1.5 px-3 bg-slate-900/60 rounded-xl border border-slate-800/50 text-[10px] text-slate-400 font-medium';
                        breakEl.innerHTML = `<i class="fa-solid fa-mug-hot text-accent"></i> შესვენება: <strong class="text-slate-200 font-mono">${formatBreakTime(breakMinutes)}</strong>`;
                        container.appendChild(breakEl);
                    }
                }

        function renderSchedule() {
            const container = document.getElementById('schedule-container');
            const scrollPos = container.scrollTop;
            container.innerHTML = '';

            const daysOrder = ['სამშაბათი', 'ოთხშაბათი', 'ხუთშაბათი', 'პარასკევი'];
            if (currentFilter === 'all') {
                daysOrder.forEach(day => {
                    const dayItems = scheduleData.filter(i => i.day === day).sort((a, b) => timeToMinutes(a.startTime) - timeToMinutes(b.startTime));
                    if (dayItems.length > 0) {
                        const headerEl = document.createElement('div');
                        headerEl.className = 'flex items-center space-x-2.5 pt-3 pb-1';
                        headerEl.innerHTML = `<span class="text-sm font-extrabold uppercase tracking-wider text-blue-400">${day}</span><div class="h-[1px] bg-slate-800 flex-1"></div>`;
                        container.appendChild(headerEl);
                        renderItemsWithBreaks(dayItems, container);
                    }
                });
            } else {
                const filtered = scheduleData.filter(item => item.day === currentFilter).sort((a, b) => timeToMinutes(a.startTime) - timeToMinutes(b.startTime));
                const headerEl = document.createElement('div');
                headerEl.className = 'flex items-center space-x-2.5 pt-3 pb-1';
                headerEl.innerHTML = `<span class="text-sm font-extrabold uppercase tracking-wider text-blue-400">${currentFilter}</span><div class="h-[1px] bg-slate-800 flex-1"></div>`;
                container.appendChild(headerEl);

                if (filtered.length === 0) {
                    container.innerHTML += `<div class="glass-card rounded-2xl p-6 text-center text-slate-400 space-y-2 mt-2"><i class="fa-solid fa-mug-hot text-2xl text-accent mb-1"></i><p class="font-bold text-white text-xs">ამ დღეს ლექციები არ არის</p></div>`;
                } else {
                    renderItemsWithBreaks(filtered, container);
                }
            }
            container.scrollTop = scrollPos;
        }

        function filterDay(day) {
            currentFilter = day;
            document.querySelectorAll('.day-btn').forEach(btn => {
                if (btn.getAttribute('data-day') === day) {
                    btn.className = 'day-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-accent text-white shadow-md shadow-accent/20';
                } else {
                    btn.className = 'day-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-slate-900/90 text-blue-400 hover:text-white border border-slate-800';
                }
            });
            renderSchedule();
        }

        function updateNextLectureCountdown() {
            const now = new Date();
            const currentJsDay = now.getDay();
            const currentMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
            const daysOrder = ['კვირა', 'ორშაბათი', 'სამშაბათი', 'ოთხშაბათი', 'ხუთშაბათი', 'პარასკევი', 'შაბათი'];
            let foundNext = null;

            for (let dOffset = 0; dOffset < 7; dOffset++) {
                let checkDayIndex = (currentJsDay + dOffset) % 7;
                let checkDayName = daysOrder[checkDayIndex];
                let dayItems = scheduleData.filter(i => i.day === checkDayName).sort((a, b) => timeToMinutes(a.startTime) - timeToMinutes(b.startTime));

                for (let item of dayItems) {
                    let startMin = timeToMinutes(item.startTime);
                    let endMin = timeToMinutes(item.endTime);
                    if (dOffset === 0) {
                        if (currentMin < startMin) {
                            foundNext = { item, dayLabel: 'დღეს', diffMin: startMin - currentMin };
                            break;
                        } else if (currentMin >= startMin && currentMin <= endMin) {
                            foundNext = { item, dayLabel: 'მიმდინარეობს ახლა', diffMin: 0 };
                            break;
                        }
                    } else {
                        let diffMin = (dOffset * 24 * 60) + (startMin - (now.getHours() * 60 + now.getMinutes()));
                        foundNext = { item, dayLabel: dOffset === 1 ? 'ხვალ' : checkDayName, diffMin };
                        break;
                    }
                }
                if (foundNext) break;
            }

            const card = document.getElementById('next-lecture-card');
            if (!foundNext) {
                card.classList.add('hidden');
                return;
            }

            card.classList.remove('hidden');
            const loc = parseLocation(foundNext.item.location);
            document.getElementById('nl-title').innerText = foundNext.item.course;
            document.getElementById('nl-lecturer').innerText = foundNext.item.lecturer;
            document.getElementById('nl-room').innerHTML = `<i class="fa-solid fa-building text-accent text-xs"></i> <span>${loc.building} / აუდ: ${loc.room}</span>`;
            document.getElementById('nl-time').innerText = `${foundNext.item.startTime} - ${foundNext.item.endTime}`;
            document.getElementById('nl-status-container').innerHTML = `<span class="text-[9px] font-bold px-2.5 py-0.5 rounded-md bg-accent/20 text-accent border border-accent/30">${foundNext.dayLabel}</span> ${getTypeBadgeHtml(foundNext.item.type)}`;

            const timerEl = document.getElementById('countdown-timer');
            if (foundNext.diffMin === 0) {
                timerEl.innerText = 'მიმდინარეობს';
                timerEl.className = 'text-[11px] font-mono font-bold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-xl border border-emerald-500/25 shadow-sm';
            } else {
                const hoursLeft = Math.floor(foundNext.diffMin / 60);
                const minsLeft = Math.floor(foundNext.diffMin % 60);
                let timeStr = hoursLeft > 0 ? `${hoursLeft}სთ ${minsLeft}წთ` : `${minsLeft}წთ`;
                timerEl.innerText = `დაწყებამდე: ${timeStr}`;
                timerEl.className = 'text-[11px] font-mono font-bold text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-xl border border-amber-500/25 shadow-sm';
            }
        }

        function renderCalendar() {
            document.getElementById('cal-month-year-title').innerText = `${monthsGeo[calMonth]} ${calYear}`;
            const grid = document.getElementById('cal-days-grid');
            grid.innerHTML = '';

            const firstDayIndex = new Date(calYear, calMonth, 1).getDay();
            const adjustedFirstDay = (firstDayIndex + 6) % 7;
            const totalDays = new Date(calYear, calMonth + 1, 0).getDate();
            const prevMonthDays = new Date(calYear, calMonth, 0).getDate();

            for (let i = adjustedFirstDay - 1; i >= 0; i--) {
                const dayNum = prevMonthDays - i;
                const cell = document.createElement('div');
                cell.className = 'h-10 rounded-xl bg-slate-900/30 text-slate-600 flex items-center justify-center text-xs font-semibold select-none';
                cell.innerText = dayNum;
                grid.appendChild(cell);
            }

            const today = new Date();
            for (let day = 1; day <= totalDays; day++) {
                const cellDate = new Date(calYear, calMonth, day);
                const dayName = dayNamesGeo[cellDate.getDay()];
                const hasLectures = scheduleData.some(i => i.day === dayName);
                const isToday = cellDate.getDate() === today.getDate() && cellDate.getMonth() === today.getMonth() && cellDate.getFullYear() === today.getFullYear();
                const isSelected = cellDate.getDate() === selectedDateObj.getDate() && cellDate.getMonth() === selectedDateObj.getMonth() && cellDate.getFullYear() === selectedDateObj.getFullYear();

                const cell = document.createElement('div');
                let cellClass = 'h-10 rounded-xl flex flex-col items-center justify-center text-xs font-bold transition-all cursor-pointer relative ';
                if (isSelected) {
                    cellClass += 'bg-accent text-white shadow-lg shadow-accent/30 ring-2 ring-white/20';
                } else if (isToday) {
                    cellClass += 'bg-slate-800 text-blue-400 border border-blue-500/40';
                } else {
                    cellClass += 'bg-slate-900/90 text-slate-300 hover:bg-slate-800 border border-slate-800/80';
                }

                cell.className = cellClass;
                cell.innerHTML = `<span>${day}</span>`;
                if (hasLectures) {
                    cell.innerHTML += `<span class="w-1 h-1 rounded-full ${isSelected ? 'bg-white' : 'bg-accent'} mt-0.5"></span>`;
                }

                cell.onclick = () => {
                    selectedDateObj = new Date(calYear, calMonth, day);
                    renderCalendar();
                    renderSelectedDateDetails();
                };
                grid.appendChild(cell);
            }

            const totalCells = adjustedFirstDay + totalDays;
            const remainingCells = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
            for (let i = 1; i <= remainingCells; i++) {
                const cell = document.createElement('div');
                cell.className = 'h-10 rounded-xl bg-slate-900/30 text-slate-600 flex items-center justify-center text-xs font-semibold select-none';
                cell.innerText = i;
                grid.appendChild(cell);
            }
            renderSelectedDateDetails();
        }

        function changeMonth(direction) {
            calMonth += direction;
            if (calMonth > 11) { calMonth = 0; calYear++; }
            else if (calMonth < 0) { calMonth = 11; calYear--; }
            renderCalendar();
        }

        function renderSelectedDateDetails() {
            const detailsContainer = document.getElementById('cal-selected-details');
            const dayNum = selectedDateObj.getDay();
            const dayName = dayNamesGeo[dayNum];
            const dayItems = scheduleData.filter(i => i.day === dayName).sort((a, b) => timeToMinutes(a.startTime) - timeToMinutes(b.startTime));
            let timeRangeStr = dayItems.length > 0 ? `${dayItems[0].startTime} - ${dayItems[dayItems.length - 1].endTime}` : 'ლექციები არ არის';

            detailsContainer.innerHTML = `
                <div class="flex items-center justify-between pb-2.5 border-b border-slate-800">
                    <div>
                        <h4 class="font-extrabold text-xs text-blue-400 uppercase tracking-wider">${dayName}, ${selectedDateObj.getDate()} ${monthsGeo[selectedDateObj.getMonth()]}</h4>
                        <p class="text-[10px] text-slate-400 mt-0.5">დიაპაზონი: <strong class="text-accent font-mono">${timeRangeStr}</strong></p>
                    </div>
                    <span class="text-[10px] font-mono text-accent bg-accent/10 px-2.5 py-1 rounded-xl border border-accent/25 font-bold">${dayItems.length} სესია</span>
                </div>
            `;

            if (dayItems.length === 0) {
                detailsContainer.innerHTML += `<div class="text-center py-4 text-slate-400 space-y-1"><i class="fa-solid fa-face-smile text-accent text-lg mb-1"></i><p class="text-xs font-bold text-white">ამ დღეს თავისუფალი ხართ!</p></div>`;
                return;
            }

            const listWrapper = document.createElement('div');
            listWrapper.className = 'space-y-2 pt-1 max-h-60 overflow-y-auto pr-1';
            dayItems.forEach(item => {
                const loc = parseLocation(item.location);
                const itemCard = document.createElement('div');
                itemCard.className = 'bg-slate-900/90 rounded-xl p-3 border border-slate-800 space-y-1.5';
                itemCard.innerHTML = `
                    <div class="flex items-center justify-between text-[10px]">
                        <span class="font-mono font-bold text-white bg-slate-800 px-2 py-0.5 rounded">${item.startTime} - ${item.endTime}</span>
                        ${getTypeBadgeHtml(item.type)}
                    </div>
                    <div class="font-semibold text-xs text-white">${item.course}</div>
                    <div class="text-[10px] text-slate-400 flex items-center gap-1"><i class="fa-solid fa-door-open text-accent"></i> ${loc.building} / აუდ: ${loc.room}</div>
                `;
                listWrapper.appendChild(itemCard);
            });
            detailsContainer.appendChild(listWrapper);
        }

        // Notes Storage
        function getNotes() {
            try {
                const saved = localStorage.getItem('unitable_notes_v3');
                return saved ? JSON.parse(saved) : [];
            } catch (e) { return []; }
        }

        function saveNote() {
            const titleInput = document.getElementById('note-title-input');
            const textInput = document.getElementById('note-text-input');
            const title = titleInput.value.trim();
            const text = textInput.value.trim();
            if (!title && !text) return;

            const notes = getNotes();
            const now = new Date();
            notes.unshift({ id: Date.now(), title: title || 'უსათაურო', text, date: `${now.getDate()} ${monthsGeo[now.getMonth()]}` });
            localStorage.setItem('unitable_notes_v3', JSON.stringify(notes));
            titleInput.value = '';
            textInput.value = '';
            renderNotes();
        }

        function deleteNote(id) {
            let notes = getNotes().filter(n => n.id !== id);
            localStorage.setItem('unitable_notes_v3', JSON.stringify(notes));
            renderNotes();
        }

        function renderNotes() {
            const container = document.getElementById('notes-container');
            const counter = document.getElementById('notes-counter');
            const notes = getNotes();
            container.innerHTML = '';
            counter.innerText = notes.length;

            if (notes.length === 0) {
                container.innerHTML = `<div class="glass-card rounded-2xl p-8 text-center text-slate-400 space-y-3"><div class="w-12 h-12 rounded-2xl bg-accent/10 text-accent flex items-center justify-center mx-auto text-lg shadow-inner"><i class="fa-solid fa-note-sticky"></i></div><div><p class="font-bold text-white text-xs mb-0.5">შენიშვნები ჯერ არ არის</p><p class="text-[10px] text-slate-500">დაამატეთ მნიშვნელოვანი ჩანაწერები</p></div></div>`;
                return;
            }

            notes.forEach(note => {
                const card = document.createElement('div');
                card.className = 'glass-card glass-card-hover rounded-2xl p-4 space-y-2 relative group transition-all duration-200 border border-slate-800';
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-2">
                        <h4 class="font-bold text-xs text-white leading-snug">${note.title}</h4>
                        <button onclick="deleteNote(${note.id})" class="text-slate-500 hover:text-red-400 transition-colors p-1.5 rounded-lg hover:bg-red-500/10"><i class="fa-solid fa-trash-can text-xs"></i></button>
                    </div>
                    ${note.text ? `<p class="text-[11px] text-slate-300 leading-relaxed font-normal">${note.text}</p>` : ''}
                    <div class="text-[9px] text-slate-400 font-mono pt-2 border-t border-slate-800/60 flex items-center gap-1.5"><i class="fa-regular fa-clock text-accent"></i> ${note.date}</div>
                `;
                container.appendChild(card);
            });
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-btn').classList.remove('hidden');
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => { deferredPrompt = null; document.getElementById('install-btn').classList.add('hidden'); });
            }
        }

        renderSchedule();
        updateNextLectureCountdown();
    </script>
</body>
</html>
