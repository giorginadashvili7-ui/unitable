<!DOCTYPE html>
<html lang="ka" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- DYNAMIC APP TITLE -->
    <title id="meta-app-title">UniTable Pro</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#070a14',
                        cardBg: '#0f172a',
                        accent: '#3b82f6',
                        accentHover: '#2563eb',
                        dayRed: '#f87171'
                    }
                }
            }
        }
    </script>
    <!-- Inter Font & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- PWA Dynamic Manifest & Icon Setup -->
    <link id="pwa-manifest" rel="manifest" href="">
    <link id="favicon-link" rel="icon" type="image/svg+xml" href="">
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" id="apple-app-title" content="UniTable Pro">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }
        .glass-card-hover:hover {
            border-color: rgba(59, 130, 246, 0.35);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.1);
        }
        .pulse-glow {
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.15);
        }
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade {
            animation: fadeIn 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col justify-between selection:bg-accent selection:text-white pb-6">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 glass-card border-b border-slate-800/50 px-3.5 py-3 shadow-xl">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div id="header-logo-container" class="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-violet-500 flex items-center justify-center shadow-md shadow-blue-500/30 text-white text-xs">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div>
                    <h1 id="header-app-name" class="font-extrabold text-sm leading-none tracking-tight bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">UniTable Pro</h1>
                    <p class="text-[10px] text-slate-400 mt-0.5 font-medium" id="current-date-str">იტვირთება...</p>
                </div>
            </div>

            <!-- Center: Today's active study hours range -->
            <div class="text-center px-3 py-1 bg-slate-900/90 rounded-xl border border-slate-800 shadow-inner">
                <div class="text-[9px] uppercase tracking-wider text-slate-400 font-bold mb-0.5">დღის დიაპაზონი</div>
                <div id="today-active-range" class="text-[11px] font-mono font-extrabold text-accent tracking-tight">--:-- - --:--</div>
            </div>

            <div class="text-right flex items-center gap-2">
                <div>
                    <div id="live-clock" class="text-xs font-mono font-extrabold text-slate-100 tracking-wider leading-none">00:00:00</div>
                    <div class="text-[9px] text-emerald-400 font-semibold mt-1 flex items-center justify-end gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> ონლაინ
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-md w-full mx-auto p-3.5 flex-1 space-y-3.5">
        
        <!-- Tab Navigation -->
        <div class="grid grid-cols-3 gap-1.5 p-1 glass-card rounded-2xl border border-slate-800/80">
            <button onclick="switchTab('schedule')" id="tab-btn-schedule" class="py-2.5 px-2 rounded-xl text-[11px] font-bold transition-all bg-accent text-white shadow-md shadow-accent/25 flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-calendar-days text-xs"></i> განრიგი
            </button>
            <button onclick="switchTab('calendar')" id="tab-btn-calendar" class="py-2.5 px-2 rounded-xl text-[11px] font-bold transition-all text-slate-400 hover:text-white flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-calendar text-xs"></i> კალენდარი
            </button>
            <button onclick="switchTab('notes')" id="tab-btn-notes" class="py-2.5 px-2 rounded-xl text-[11px] font-bold transition-all text-slate-400 hover:text-white flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-note-sticky text-xs"></i> შენიშვნები
            </button>
        </div>

        <!-- TAB 1: SCHEDULE VIEW -->
        <div id="tab-content-schedule" class="space-y-3.5 animate-fade">
            <!-- Upcoming Lecture Card -->
            <div id="next-lecture-card" class="glass-card rounded-2xl p-4 border border-blue-500/30 pulse-glow relative overflow-hidden hidden">
                <div class="absolute -right-8 -bottom-8 w-24 h-24 bg-blue-500/15 rounded-full blur-2xl pointer-events-none"></div>
                <div class="flex items-center justify-between mb-2.5">
                    <div id="nl-status-container" class="flex items-center gap-1.5 flex-wrap"></div>
                    <span id="countdown-timer" class="text-[11px] font-mono font-bold text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-lg border border-amber-500/25 shadow-sm">--:--</span>
                </div>
                <h2 id="nl-title" class="font-bold text-xs text-white mb-1 leading-snug">სათაური</h2>
                <div class="text-[11px] text-slate-300 mb-3 font-medium flex items-center gap-1.5">
                    <i class="fa-solid fa-chalkboard-user text-accent text-xs"></i> <span id="nl-lecturer">ლექტორი</span>
                </div>
                <div class="flex items-center justify-between text-[11px] text-slate-300 pt-2.5 border-t border-slate-800/60">
                    <div id="nl-room" class="truncate flex items-center gap-1.5 flex-wrap"></div>
                    <span id="nl-time" class="font-mono font-bold text-slate-200">დრო</span>
                </div>
            </div>

            <!-- Day Filters (Weekday names in Red as requested) -->
            <div class="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none" id="day-filters">
                <button onclick="filterDay('all')" class="day-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-accent text-white shadow-md shadow-accent/20" data-day="all">
                    <i class="fa-solid fa-layer-group mr-1"></i> ყველა
                </button>
                <button onclick="filterDay('სამშაბათი')" class="day-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-slate-900/90 text-dayRed hover:text-white border border-slate-800" data-day="სამშაბათი">სამშაბათი</button>
                <button onclick="filterDay('ოთხშაბათი')" class="day-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-slate-900/90 text-dayRed hover:text-white border border-slate-800" data-day="ოთხშაბათი">ოთხშაბათი</button>
                <button onclick="filterDay('ხუთშაბათი')" class="day-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-slate-900/90 text-dayRed hover:text-white border border-slate-800" data-day="ხუთშაბათი">ხუთშაბათი</button>
                <button onclick="filterDay('პარასკევი')" class="day-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-slate-900/90 text-dayRed hover:text-white border border-slate-800" data-day="პარასკევი">პარასკევი</button>
            </div>

            <!-- Schedule Container -->
            <div class="space-y-3" id="schedule-container">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- TAB 2: CALENDAR VIEW (Interactive Date Picker with Busy Hours) -->
        <div id="tab-content-calendar" class="space-y-4 hidden animate-fade">
            <div class="glass-card rounded-2xl p-4 space-y-4 border border-slate-800 shadow-xl relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-28 h-28 bg-accent/10 rounded-full blur-3xl pointer-events-none"></div>
                
                <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                    <button onclick="changeMonth(-1)" class="w-8 h-8 rounded-xl bg-slate-900/90 hover:bg-slate-800 text-slate-300 flex items-center justify-center border border-slate-800 transition-all">
                        <i class="fa-solid fa-chevron-left text-xs"></i>
                    </button>
                    <h3 id="cal-month-year-title" class="font-extrabold text-sm text-white tracking-wide">სექტემბერი 2026</h3>
                    <button onclick="changeMonth(1)" class="w-8 h-8 rounded-xl bg-slate-900/90 hover:bg-slate-800 text-slate-300 flex items-center justify-center border border-slate-800 transition-all">
                        <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                </div>

                <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-dayRed uppercase tracking-wider">
                    <div>ორშ</div><div>სამ</div><div>ოთხ</div><div>ხუთ</div><div>პარ</div><div>შაბ</div><div>კვ</div>
                </div>

                <div id="cal-days-grid" class="grid grid-cols-7 gap-1.5 pt-1">
                    <!-- Populated via JS -->
                </div>
            </div>

            <div id="cal-selected-details" class="glass-card rounded-2xl p-4 space-y-3 border border-slate-800 shadow-xl">
                <!-- Populated when date is selected -->
            </div>
        </div>

        <!-- TAB 3: NOTES VIEW -->
        <div id="tab-content-notes" class="space-y-4 hidden animate-fade">
            <div class="glass-card rounded-2xl p-5 space-y-3.5 border border-slate-800 shadow-xl relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-28 h-28 bg-accent/10 rounded-full blur-3xl pointer-events-none"></div>
                <div class="flex items-center justify-between pb-2.5 border-b border-slate-800">
                    <div class="flex items-center gap-2">
                        <div class="w-7 h-7 rounded-xl bg-accent/20 text-accent flex items-center justify-center text-xs shadow-sm">
                            <i class="fa-solid fa-pen-nib"></i>
                        </div>
                        <h3 class="font-extrabold text-xs text-white uppercase tracking-wider">სწრაფი შენიშვნა</h3>
                    </div>
                    <span class="text-[10px] text-slate-400 font-medium">ჩანაწერები</span>
                </div>
                
                <div class="space-y-3">
                    <div>
                        <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">სათაური / საგანი</label>
                        <input type="text" id="note-title-input" placeholder="მაგ: მენეჯმენტის პროექტი..." class="w-full bg-slate-900/90 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-accent transition-all shadow-inner">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">ტექსტი</label>
                        <textarea id="note-text-input" rows="3.5" placeholder="ჩაწერეთ მნიშვნელოვანი დეტალები..." class="w-full bg-slate-900/90 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-accent transition-all resize-none shadow-inner"></textarea>
                    </div>
                </div>

                <button onclick="saveNote()" class="w-full py-2.5 bg-accent hover:bg-accentHover text-white rounded-xl text-xs font-bold transition-all shadow-lg shadow-accent/25 flex items-center justify-center gap-2 active:scale-[0.98]">
                    <i class="fa-solid fa-plus text-xs"></i> შენახვა
                </button>
            </div>

            <div class="flex items-center justify-between px-1">
                <h4 class="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-1.5">
                    <i class="fa-solid fa-box-archive text-accent"></i> შენახული შენიშვნები
                </h4>
                <span id="notes-counter" class="text-[10px] font-mono text-accent bg-accent/10 px-2.5 py-1 rounded-lg border border-accent/25 font-bold">0</span>
            </div>

            <div class="space-y-2.5" id="notes-container"></div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="glass-card border-t border-slate-800/50 py-3 px-4 text-center mt-4">
        <div class="max-w-md mx-auto flex items-center justify-between text-[10px] text-slate-400">
            <span class="font-medium" id="footer-version-str">UniTable Pro v3.2</span>
            <button id="install-btn" onclick="installPWA()" class="hidden bg-accent hover:bg-accentHover text-white px-3.5 py-1.5 rounded-lg font-semibold shadow-md shadow-accent/20 transition-all flex items-center gap-1.5">
                <i class="fa-solid fa-download"></i> დაყენება
            </button>
            <span class="flex items-center gap-1.5 text-emerald-400 font-semibold"><i class="fa-solid fa-shield-check"></i> უსაფრთხო</span>
        </div>
    </footer>

        // Automatically merge consecutive identical sessions separated by short breaks (<= 15 mins)
        function getProcessedSchedule() {
            const days = ['სამშაბათი', 'ოთხშაბათი', 'ხუთშაბათი', 'პარასკევი'];
            let result = [];

            days.forEach(day => {
                let dayItems = rawScheduleData.filter(i => i.day === day).sort((a, b) => timeToMinutes(a.startTime) - timeToMinutes(b.startTime));
                let merged = [];

                for (let i = 0; i < dayItems.length; i++) {
                    let curr = { ...dayItems[i] };
                    while (i + 1 < dayItems.length) {
                        let next = dayItems[i + 1];
                        if (
                            next.course === curr.course &&
                            next.type === curr.type &&
                            next.lecturer === curr.lecturer &&
                            next.location === curr.location &&
                            (timeToMinutes(next.startTime) - timeToMinutes(curr.endTime)) <= 15
                        ) {
                            curr.endTime = next.endTime;
                            i++;
                        } else {
                            break;
                        }
                    }
                    merged.push(curr);
                }
                result = result.concat(merged);
            });

            return result;
        }

            if (currentJsDay < itemDayIndex) {

        function updateNextLectureCountdown() {
            const now = new Date();
            const currentJsDay = now.getDay();
            const currentTotalSecToday = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

            let upcoming = null;
            let minDiffSeconds = Infinity;

            scheduleData.forEach(lec => {
                const lecDayIndex = daysMapReverse[lec.day];
                if (lecDayIndex === undefined) return;

                const [lh, lm] = lec.startTime.split(':').map(Number);
                const lecSecFromMidnight = lh * 3600 + lm * 60;

                let dayDiff = lecDayIndex - currentJsDay;
                if (dayDiff < 0) {
                    dayDiff += 7;
                } else if (dayDiff === 0 && lecSecFromMidnight <= currentTotalSecToday) {
                    dayDiff = 7;
                }

                const totalSecUntilLec = (dayDiff * 86400) + lecSecFromMidnight - currentTotalSecToday;

                if (totalSecUntilLec > 0 && totalSecUntilLec < minDiffSeconds) {
                    minDiffSeconds = totalSecUntilLec;
                    upcoming = { ...lec, dayDiff: dayDiff };
                }
            });

            const card = document.getElementById('next-lecture-card');
            if (upcoming && minDiffSeconds !== Infinity) {
                card.classList.remove('hidden');
                document.getElementById('nl-title').innerText = `${upcoming.course}`;
                document.getElementById('nl-lecturer').innerText = `${upcoming.lecturer}`;
                
                const loc = parseLocation(upcoming.location);
                document.getElementById('nl-room').innerHTML = `
                    <div class="flex items-center gap-1.5 flex-wrap">
                        <span class="flex items-center gap-1 text-slate-300 bg-slate-900/90 px-2 py-0.5 rounded-lg border border-slate-800 text-[10px]">

                        </span>
                        <span class="flex items-center gap-1 text-slate-300 bg-slate-900/90 px-2 py-0.5 rounded-lg border border-slate-800 text-[10px]">
                            <i class="fa-solid fa-layer-group text-amber-400"></i> ${loc.floor}
                        </span>
                        <span class="flex items-center gap-1 text-white bg-blue-600/20 px-2.5 py-0.5 rounded-lg border border-blue-500/30 font-bold text-[10px]">
                            <i class="fa-solid fa-door-open text-blue-400"></i> აუდიტორია: ${loc.room}
                        </span>
                    </div>
                `;
                
                let dayStr = '';
                if (upcoming.dayDiff === 0) dayStr = 'დღეს';
                else if (upcoming.dayDiff === 1) dayStr = 'ხვალ';
                else dayStr = upcoming.day;

                document.getElementById('nl-time').innerText = `${dayStr}, ${upcoming.startTime}`;

                const status = getItemStatus(upcoming);
                const statusBadge = getStatusBadgeHtml(status);
                const typeBadge = getTypeBadgeHtml(upcoming.type);
                document.getElementById('nl-status-container').innerHTML = `${statusBadge}${typeBadge}`;

                const daysLeft = Math.floor(minDiffSeconds / 86400);
                const hoursLeft = Math.floor((minDiffSeconds % 86400) / 3600);
                const minutesLeft = Math.floor((minDiffSeconds % 3600) / 60);

                let countdownStr = '';
                if (daysLeft > 0) countdownStr += `${daysLeft}დ `;
                if (hoursLeft > 0 || daysLeft > 0) countdownStr += `${hoursLeft}ს `;
                countdownStr += `${minutesLeft}წთ`;
                
                document.getElementById('countdown-timer').innerText = countdownStr;
            } else {
                card.classList.add('hidden');
            }
        }

            const firstDayIndex = new Date(calYear, calMonth, 1).getDay();

            const totalDaysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
            const prevMonthDays = new Date(calYear, calMonth, 0).getDate();

            for (let i = adjustedFirstDay - 1; i >= 0; i--) {
                const dayNum = prevMonthDays - i;
                const cell = document.createElement('div');

                const isSelected = selectedDateObj.getDate() === d && selectedDateObj.getMonth() === calMonth && selectedDateObj.getFullYear() === calYear;

                let baseClass = 'h-9 rounded-xl flex flex-col items-center justify-center text-xs font-bold cursor-pointer transition-all relative ';

                cell.innerHTML = `<span>${d}</span>`;

                const dayNameGeo = dayNamesGeo[cellDate.getDay()];
                const hasLecs = scheduleData.some(i => i.day === dayNameGeo);
                if (hasLecs && !isSelected) {
                    cell.innerHTML += `<span class="w-1 h-1 rounded-full bg-accent absolute bottom-1"></span>`;
                }

                cell.onclick = () => {
                    selectedDateObj = cellDate;
                    renderCalendar();
                    renderSelectedDateDetails();
                };

                grid.appendChild(cell);
            }

        function renderSelectedDateDetails() {
            const detailsContainer = document.getElementById('cal-selected-details');
            const dayNum = selectedDateObj.getDay();

            const dateNum = selectedDateObj.getDate();
            const monthName = monthsGeo[selectedDateObj.getMonth()];

            const dayItems = scheduleData.filter(i => i.day === dayName).sort((a, b) => timeToMinutes(a.startTime) - timeToMinutes(b.startTime));

            let timeRangeStr = 'ლექციები არ არის';
            if (dayItems.length > 0) {
                timeRangeStr = `${dayItems[0].startTime} - ${dayItems[dayItems.length - 1].endTime}`;
            }

            detailsContainer.innerHTML = `
                <div class="flex items-center justify-between pb-2.5 border-b border-slate-800">
                    <div>
                        <h4 class="font-extrabold text-xs text-dayRed uppercase tracking-wider">${dayName}, ${dateNum} ${monthName}</h4>
                        <p class="text-[10px] text-slate-400 mt-0.5">დაკავებულობის დიაპაზონი: <strong class="text-accent font-mono">${timeRangeStr}</strong></p>
                    </div>
                    <span class="text-[10px] font-mono text-accent bg-accent/10 px-2.5 py-1 rounded-lg border border-accent/25 font-bold">${dayItems.length} სესია</span>
                </div>
            `;

            if (dayItems.length === 0) {
                detailsContainer.innerHTML += `
                    <div class="text-center py-4 text-slate-400 space-y-1">
                        <i class="fa-solid fa-face-smile text-accent text-lg mb-1"></i>
                        <p class="text-xs font-bold text-white">ამ დღეს თავისუფალი ხართ!</p>
                    </div>
                `;
                return;
            }

            const listWrapper = document.createElement('div');
            listWrapper.className = 'space-y-2 pt-1 max-h-60 overflow-y-auto pr-1';

            dayItems.forEach(item => {
                const loc = parseLocation(item.location);
                const itemCard = document.createElement('div');
                itemCard.className = 'bg-slate-900/90 rounded-xl p-3 border border-slate-800 space-y-1.5';
                itemCard.innerHTML = `
                    <div class="flex items-center justify-between text-[10px]">
                        <span class="font-mono font-bold text-white bg-slate-800 px-2 py-0.5 rounded">${item.startTime} - ${item.endTime}</span>
                        ${getTypeBadgeHtml(item.type)}
                    </div>
                    <div class="font-semibold text-xs text-white">${item.course}</div>
                    <div class="text-[10px] text-slate-400 flex items-center gap-1">
                        <i class="fa-solid fa-door-open text-accent"></i> ${loc.building} / აუდ: ${loc.room}
                    </div>
                `;
                listWrapper.appendChild(itemCard);
            });

            detailsContainer.appendChild(listWrapper);
        }

        // Local Storage Notes Management
        function getNotes() {
            try {
                const saved = localStorage.getItem('unitable_notes_v3');
                return saved ? JSON.parse(saved) : [];
            } catch (e) {
                return [];
            }
        }

        function saveNote() {
            const titleInput = document.getElementById('note-title-input');
            const textInput = document.getElementById('note-text-input');
            const title = titleInput.value.trim();
            const text = textInput.value.trim();

            if (!title && !text) return;

            const notes = getNotes();
            const now = new Date();
            const newNote = {
                id: Date.now(),
                title: title || 'უსათაურო',
                text: text,
                date: `${now.getDate()} ${monthsGeo[now.getMonth()]}`
            };

            notes.unshift(newNote);
            localStorage.setItem('unitable_notes_v3', JSON.stringify(notes));

            titleInput.value = '';
            textInput.value = '';
            renderNotes();
        }

        function deleteNote(id) {
            let notes = getNotes();
            notes = notes.filter(n => n.id !== id);
            localStorage.setItem('unitable_notes_v3', JSON.stringify(notes));
            renderNotes();
        }

        function renderNotes() {
            const container = document.getElementById('notes-container');
            const counter = document.getElementById('notes-counter');
            const notes = getNotes();
            container.innerHTML = '';
            counter.innerText = notes.length;

            if (notes.length === 0) {
                container.innerHTML = `
                    <div class="glass-card rounded-2xl p-8 text-center text-slate-400 space-y-3">
                        <div class="w-12 h-12 rounded-2xl bg-accent/10 text-accent flex items-center justify-center mx-auto text-lg shadow-inner">
                            <i class="fa-solid fa-note-sticky"></i>
                        </div>
                        <div>
                            <p class="font-bold text-white text-xs mb-0.5">შენიშვნები ჯერ არ არის</p>
                            <p class="text-[10px] text-slate-500">დაამატეთ მნიშვნელოვანი ჩანაწერები ზემოთ მოცემული ფორმით</p>
                        </div>
                    </div>
                `;
                return;
            }

            notes.notes = notes || [];
            notes.forEach(note => {
                const card = document.createElement('div');
                card.className = 'glass-card glass-card-hover rounded-2xl p-4 space-y-2 relative group transition-all duration-200 border border-slate-800';
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-2">
                        <h4 class="font-bold text-xs text-white leading-snug">${note.title}</h4>
                        <button onclick="deleteNote(${note.id})" class="text-slate-500 hover:text-red-400 transition-colors p-1.5 rounded-lg hover:bg-red-500/10"><i class="fa-solid fa-trash-can text-xs"></i></button>
                    </div>
                    ${note.text ? `<p class="text-[11px] text-slate-300 leading-relaxed font-normal">${note.text}</p>` : ''}
                    <div class="text-[9px] text-slate-400 font-mono pt-2 border-t border-slate-800/60 flex items-center gap-1.5">
                        <i class="fa-regular fa-clock text-accent"></i> ${note.date}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-btn').classList.remove('hidden');
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    deferredPrompt = null;
                    document.getElementById('install-btn').classList.add('hidden');
                });
            }
        }

        renderSchedule();
        updateNextLectureCountdown();
    </script>
</body>
</html>
