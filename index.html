<!doctype html>
<html lang="ka" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#080b14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ჩემი უნივერსიტეტის განრიგი</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #080b14; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
    .glass { background: rgba(17,24,39,.78); border: 1px solid rgba(148,163,184,.12); backdrop-filter: blur(18px); }
    .soft { box-shadow: 0 12px 32px rgba(0,0,0,.2); }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 99px; }
    .safe-bottom { padding-bottom: calc(88px + env(safe-area-inset-bottom)); }
  </style>
</head>
<body class="min-h-screen safe-bottom">
  <header class="sticky top-0 z-20 glass border-x-0 border-t-0 px-4 py-3">
    <div class="mx-auto flex max-w-md items-center justify-between">
      <div>
        <h1 class="flex items-center gap-2 text-base font-bold"><i class="fa-solid fa-graduation-cap text-indigo-400"></i>უნივერსიტეტის განრიგი</h1>
        <p id="date" class="mt-1 text-[11px] text-slate-400">იტვირთება...</p>
      </div>
      <time id="clock" class="rounded-full border border-slate-700 bg-slate-900/80 px-2.5 py-1 font-mono text-xs text-indigo-300">00:00:00</time>
    </div>
  </header>

  <main class="mx-auto max-w-md space-y-4 p-4">
    <div class="grid grid-cols-3 gap-2">
      <div class="glass rounded-xl p-3"><p id="total-count" class="text-lg font-bold text-white">18</p><p class="text-[10px] text-slate-400">სულ სესია</p></div>
      <div class="glass rounded-xl p-3"><p id="course-count" class="text-lg font-bold text-white">8</p><p class="text-[10px] text-slate-400">საგანი</p></div>
      <div class="glass rounded-xl p-3"><p id="week-hours" class="text-lg font-bold text-white">—</p><p class="text-[10px] text-slate-400">სთ კვირაში</p></div>
    </div>

    <div class="relative">
      <i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-xs text-slate-500"></i>
      <input id="search" type="search" autocomplete="off" placeholder="საგანი, ლექტორი, ოთახი..." class="glass w-full rounded-xl py-3 pl-10 pr-4 text-xs text-white outline-none placeholder:text-slate-500 focus:border-indigo-500" />
    </div>

    <section id="next-card" class="glass soft relative overflow-hidden rounded-2xl border-indigo-500/30 p-4">
      <div class="absolute -bottom-10 -right-8 h-32 w-32 rounded-full bg-indigo-500/10 blur-2xl"></div>
      <div class="relative">
        <div class="mb-3 flex items-center justify-between gap-2">
          <span id="next-status" class="rounded-full border border-indigo-500/30 bg-indigo-500/15 px-2.5 py-1 text-[10px] font-semibold text-indigo-300">უახლოესი სესია</span>
          <span id="countdown" class="font-mono text-xs font-semibold text-emerald-400">--:--:--</span>
        </div>
        <h2 id="next-title" class="text-sm font-bold leading-snug">იტვირთება...</h2>
        <p id="next-time" class="mt-1 text-xs text-indigo-300"></p>
        <div class="mt-3 grid grid-cols-2 gap-2 border-t border-slate-800 pt-3 text-[11px] text-slate-400">
          <span class="flex min-w-0 items-center gap-1.5"><i class="fa-solid fa-user-tie text-indigo-400"></i><b id="next-lecturer" class="truncate font-medium text-slate-300"></b></span>
          <span class="flex min-w-0 items-center gap-1.5"><i class="fa-solid fa-location-dot text-rose-400"></i><b id="next-location" class="truncate font-medium text-slate-300"></b></span>
        </div>
      </div>
    </section>

    <div id="tabs" class="flex gap-2 overflow-x-auto pb-1"></div>
    <div id="schedule" class="space-y-5"></div>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 z-30 border-t border-slate-800/80 bg-slate-950/90 px-6 py-2.5 backdrop-blur-xl" style="padding-bottom:calc(.625rem + env(safe-area-inset-bottom))">
    <div class="mx-auto flex max-w-md items-center justify-around text-slate-400">
      <button onclick="setFilter('all')" class="flex flex-col items-center gap-1 text-indigo-400"><i class="fa-solid fa-calendar-days"></i><span class="text-[10px]">განრიგი</span></button>
      <button onclick="document.getElementById('next-card').scrollIntoView({behavior:'smooth'})" class="flex flex-col items-center gap-1 hover:text-indigo-400"><i class="fa-solid fa-clock"></i><span class="text-[10px]">უახლოესი</span></button>
      <button onclick="resetView()" class="flex flex-col items-center gap-1 hover:text-indigo-400"><i class="fa-solid fa-rotate-right"></i><span class="text-[10px]">განახლება</span></button>
    </div>
  </nav>

<script>
const days = [
  { name:'სამშაბათი', index:2, items:[
    ['მენეჯმენტის საფუძვლები','სამუშაო ჯგუფი','11:00','11:50','ხარხელი მანანა','X კორპუსი/12 სართული/1217'],
    ['მენეჯმენტის საფუძვლები','სამუშაო ჯგუფი','12:00','12:50','ხარხელი მანანა','X კორპუსი/12 სართული/1217'],
    ['ეკონომიკის ციფრული ტრანსფორმაცია და მდგრადი ეკონომიკა','სამუშაო ჯგუფი','13:00','14:50','ლაშარაშვილი თეა','X კორპუსი/10 სართული/1010'],
    ['მარკეტინგი 2','სამუშაო ჯგუფი','15:00','15:50','მიქატაძე ცირა','X კორპუსი/11 სართული/1104'],
    ['მარკეტინგი 2','სამუშაო ჯგუფი','16:00','16:50','მიქატაძე ცირა','X კორპუსი/11 სართული/1104'],
    ['მიკროეკონომიკის პრინციპები','სამუშაო ჯგუფი','17:00','18:50','ჭიკაიძე ნათია','X კორპუსი/9 სართული/902'],
    ['ბიზნესის ადმინისტრირების საფუძვლები 1 (ბიზნესის გარემო)','სამუშაო ჯგუფი','19:00','20:50','შენგელია თეიმურაზ','X კორპუსი/10 სართული/1006']
  ]},
  { name:'ოთხშაბათი', index:3, items:[
    ['მენეჯმენტის საფუძვლები','ლექცია','11:00','11:50','ქიშელაშვილი გიული','X კორპუსი/2 სართული/201'],
    ['მარკეტინგი 2','ლექცია','15:00','15:50','სეთური მაია','X კორპუსი/11 სართული/1110'],
    ['ადამიანური რესურსების მართვა','სამუშაო ჯგუფი','17:00','17:50','ტუღუში მირიან','X კორპუსი/12 სართული/1212'],
    ['ადამიანური რესურსების მართვა','სამუშაო ჯგუფი','18:00','18:50','ტუღუში მირიან','X კორპუსი/12 სართული/1212'],
    ['ბიზნესის ადმინისტრირების საფუძვლები 1 (ბიზნესის გარემო)','ლექცია','19:00','19:50','ბაბუნაშვილი თეიმურაზ','X კორპუსი/2 სართული/208'],
    ['მიკროეკონომიკის პრინციპები','ლექცია','20:00','20:50','ავალიანი ეკა','X კორპუსი/2 სართული/205']
  ]},
  { name:'ხუთშაბათი', index:4, items:[
    ['ეკონომიკის ციფრული ტრანსფორმაცია და მდგრადი ეკონომიკა','ლექცია','17:00','17:50','კაკულია ნაზირა','X კორპუსი/2 სართული/201'],
    ['ფინანსური ინსტიტუტები და ბაზრები','ლექცია','19:00','19:50','ჩუთლაშვილი ავთანდილი','X კორპუსი/2 სართული/202']
  ]},
  { name:'პარასკევი', index:5, items:[
    ['ადამიანური რესურსების მართვა','ლექცია','18:00','18:50','კურტანიძე ანა','X კორპუსი/2 სართული/201'],
    ['ფინანსური ინსტიტუტები და ბაზრები','სამუშაო ჯგუფი','19:00','19:50','დუდუჩავა ლილია','X კორპუსი/4 სართული/404 (სასწავლო)'],
    ['ფინანსური ინსტიტუტები და ბაზრები','სამუშაო ჯგუფი','20:00','20:50','დუდუჩავა ლილია','X კორპუსი/4 სართული/404 (სასწავლო)']
  ]}
].map(day => ({...day, items:day.items.map(([title,type,start,end,lecturer,location]) => ({title,type,start,end,lecturer,location,duration:mins(end)-mins(start)}))}));

let active='all', query='';
const dayMap={2:'სამშაბათი',3:'ოთხშაბათი',4:'ხუთშაბათი',5:'პარასკევი'};
const allItems=days.flatMap(d=>d.items);
function mins(t){const [h,m]=t.split(':').map(Number);return h*60+m;}
function duration(n){return n<60?n+' წთ':Math.floor(n/60)+' სთ'+(n%60?' '+n%60+' წთ':'');}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderTabs(){document.getElementById('tabs').innerHTML=[['all','ყველა'],...days.map(d=>[d.name,d.name])].map(([v,label])=>`<button onclick="setFilter('${v}')" class="tab whitespace-nowrap rounded-xl border px-3.5 py-2 text-xs font-semibold ${active===v?'border-indigo-500 bg-indigo-600 text-white':'border-slate-700/70 bg-slate-800/80 text-slate-300'}">${label}</button>`).join('');}
function render(){
  renderTabs(); const list=days.filter(d=>active==='all'||d.name===active).map(d=>({...d,items:d.items.filter(x=>[x.title,x.type,x.lecturer,x.location].some(v=>v.toLowerCase().includes(query.toLowerCase())))})).filter(d=>d.items.length);
  const now=new Date(), today=dayMap[now.getDay()], current=now.getHours()*60+now.getMinutes();
  document.getElementById('schedule').innerHTML=list.length?list.map(d=>`<section><div class="mb-2 flex items-center gap-2"><h2 class="rounded-lg border border-indigo-500/20 bg-indigo-500/10 px-3 py-1 text-xs font-bold text-indigo-300">${d.name}</h2><span class="h-px flex-1 bg-slate-800"></span><span class="text-[10px] text-slate-500">${d.items.length} სესია</span></div><div class="space-y-2">${d.items.map((x,i)=>{const ongoing=d.name===today&&current>=mins(x.start)&&current<=mins(x.end);const past=d.name===today&&current>mins(x.end);const gap=d.items[i+1]?mins(d.items[i+1].start)-mins(x.end):0;return `<article class="glass rounded-xl p-3.5 ${ongoing?'border-emerald-500/60 ring-1 ring-emerald-500/20':''}"><div class="flex items-start justify-between gap-2"><h3 class="text-xs font-bold leading-snug text-slate-100">${esc(x.title)}</h3>${ongoing?'<span class="shrink-0 rounded-full bg-emerald-500/15 px-2 py-0.5 text-[10px] text-emerald-300">ახლა</span>':past?'<span class="shrink-0 text-[10px] text-slate-600">დასრულდა</span>':''}</div><div class="mt-2 flex flex-wrap items-center gap-1.5"><span class="rounded border px-2 py-0.5 text-[10px] ${x.type==='ლექცია'?'border-amber-500/25 bg-amber-500/10 text-amber-300':'border-blue-500/25 bg-blue-500/10 text-blue-300'}">${x.type}</span><span class="rounded bg-indigo-500/10 px-2 py-0.5 font-mono text-[10px] text-indigo-300">${x.start}–${x.end}</span><span class="text-[10px] text-slate-500">${duration(x.duration)}</span></div><div class="mt-2 space-y-1 border-t border-slate-800/80 pt-2 text-[11px] text-slate-400"><p><i class="fa-solid fa-user-tie mr-1.5 text-indigo-400"></i>${esc(x.lecturer)}</p><p><i class="fa-solid fa-location-dot mr-1.5 text-rose-400"></i>${esc(x.location)}</p></div></article>${gap>0?`<div class="py-1 text-center text-[10px] text-emerald-400/80"><i class="fa-solid fa-mug-hot mr-1"></i>შესვენება ${duration(gap)}</div>`:''}`}).join('')}</div></section>`).join(''):'<div class="py-12 text-center text-xs text-slate-500">მონაცემები ვერ მოიძებნა</div>';
}
function setFilter(v){active=v;render();}
function resetView(){query='';document.getElementById('search').value='';const today=dayMap[new Date().getDay()];setFilter(today||'all');}
function nextSession(now){for(let offset=0;offset<7;offset++){const day=days.find(d=>d.index===(now.getDay()+offset)%7);if(!day)continue;for(const item of day.items){const start=mins(item.start),end=mins(item.end),t=now.getHours()*60+now.getMinutes();if(offset===0&&t>end)continue;return {...item,day,offset,ongoing:offset===0&&t>=start&&t<=end};}}}
function update(){const now=new Date();document.getElementById('date').textContent=now.toLocaleDateString('ka-GE',{weekday:'long',month:'long',day:'numeric'});document.getElementById('clock').textContent=now.toLocaleTimeString('ka-GE');const n=nextSession(now);if(!n)return;document.getElementById('next-title').textContent=n.title;document.getElementById('next-time').textContent=`${n.day.name} • ${n.start}–${n.end} • ${n.type} • ${duration(n.duration)}`;document.getElementById('next-lecturer').textContent=n.lecturer;document.getElementById('next-location').textContent=n.location;const target=new Date(now);target.setDate(now.getDate()+n.offset);const [h,m]=n.start.split(':');target.setHours(h,m,0,0);if(n.ongoing){document.getElementById('next-status').textContent='მიმდინარეობს ახლა';document.getElementById('countdown').textContent='აქტიურია';}else{const diff=Math.max(0,target-now),s=Math.floor(diff/1000),hh=Math.floor(s/3600),mm=Math.floor(s%3600/60),ss=s%60;document.getElementById('next-status').textContent=n.offset?'მომავალი სესია':'შემდეგი სესია';document.getElementById('countdown').textContent=`${hh?hh+'სთ ':''}${mm}წთ ${ss}წმ`;}}
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim();render();});
document.getElementById('total-count').textContent=allItems.length;document.getElementById('course-count').textContent=new Set(allItems.map(x=>x.title)).size;document.getElementById('week-hours').textContent=(allItems.reduce((a,x)=>a+x.duration,0)/60).toFixed(1);render();update();setInterval(update,1000);setInterval(render,60000);
</script>
</body>
</html>
